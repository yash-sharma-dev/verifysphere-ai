services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:postgresql://db:5432/verifysphere
      - spring.datasource.username=verifysphere
      - spring.datasource.password=verifysphere
      # IMPORTANT: This API key is for development only. 
      # For production, set this in a secure way (e.g., environment variables in your deployment environment).
      - GEMINI_API_KEY=AIzaSyCCDcyj0pKyPoxzJou8YoyrF0FyLJNgZYM
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=verifysphere
      - POSTGRES_USER=verifysphere
      - POSTGRES_PASSWORD=verifysphere
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
