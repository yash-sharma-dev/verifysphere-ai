# Application Properties
spring.application.name=verifysphere-api

# Server Configuration
server.port=8080

# CORS Configuration
# For production, set to specific domain(s): cors.allowed.origins=https://yourdomain.com,https://www.yourdomain.com
# For development, localhost with any port is allowed
cors.allowed.origins=http://localhost:*

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gemini API Configuration
# IMPORTANT: Set GEMINI_API_KEY environment variable. Never commit API keys to version control.
# For development only: If GEMINI_API_KEY is not set, it will use the value below.
# TODO: Remove the default value before committing to version control!
gemini.api-key=${GEMINI_API_KEY:AIzaSyCCDcyj0pKyPoxzJou8YoyrF0FyLJNgZYM}
gemini.model-name=${GEMINI_MODEL_NAME:gemini-2.5-flash}
