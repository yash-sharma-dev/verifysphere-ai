# Application Properties
spring.application.name=verifysphere-api

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Vertex AI Configuration
vertex.ai.project-id=${VERTEX_AI_PROJECT_ID:gen-lang-client-0887854472}
vertex.ai.location=${VERTEX_AI_LOCATION:us-central1}
vertex.ai.model-name=${VERTEX_AI_MODEL_NAME:gemini-1.5-pro-latest}
